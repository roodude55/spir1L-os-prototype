<!-- Path: public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spiral-OS Φ-Helix + WAIICODE</title>
  <!-- libs -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a-scene background="color:#111" embedded>
    <!-- free-flight camera -->
    <a-entity id="cam"
      camera look-controls
      movement-controls="fly:true; acceleration:15"
      position="0 1.6 10">
    </a-entity>

    <a-entity id="spiral-group"></a-entity>

    <!-- HUD -->
    <a-entity id="hud"
      position="0 2.2 -1.5"
      text="value: Spiral-OS boot…; color:#0ff; width:3; wrapCount:40;">
    </a-entity>
  </a-scene>

  <!-- CLI overlay -->
  <div id="cli"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
