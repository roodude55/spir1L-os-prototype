<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spiral-OS Retro Platformer Creator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- A-Frame & Xterm.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <a-scene id="scene" background="color:#232323" embedded>
    <a-entity id="orthoCam"
              camera="active:true; projection:orthographic; zoom:140"
              position="0 3 10"
              wasd-controls="enabled:false"></a-entity>
    <a-entity light="type:ambient; intensity:0.7"></a-entity>
    <a-entity light="type:directional; intensity:0.5" position="1 3 2"></a-entity>
    <!-- Ground -->
    <a-plane id="floor" rotation="-90 0 0" width="24" height="8" color="#444" position="0 0 0"></a-plane>
    <!-- Platformer group root -->
    <a-entity id="level-root"></a-entity>
    <!-- Doorway (hidden unless NK-prime) -->
    <a-entity id="doorway" visible="false"></a-entity>
  </a-scene>
  <div id="cli-terminal"><div id="xterm"></div></div>
  <script src="app.js" type="module"></script>
</body>
</html>
