<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spiral-OS Prototype VR Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- A-Frame & Xterm.js CDN -->
  <script src="https://unpkg.com/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <a-scene>
    <!-- Minimal lighting for visibility -->
    <a-entity light="type:ambient; intensity:0.6"></a-entity>
    <a-entity light="type:directional; intensity:0.7" position="1 2 1"></a-entity>
    <!-- Visible floor -->
    <a-plane rotation="-90 0 0"
             width="40" height="40"
             color="#222"
             position="0 0 0"></a-plane>
    <!-- Camera: slightly raised and pulled back for view -->
    <a-entity camera
              wasd-controls look-controls
              position="0 1.7 1"></a-entity>
  </a-scene>
  <!-- HUD Terminal (toggleable) -->
  <div id="hud-terminal-container">
    <div id="xterm-container" tabindex="0"></div>
    <div id="hud-instructions">
      Press <kbd>~</kbd> or <kbd>Ctrl</kbd>+<kbd>Space</kbd> to toggle terminal. <kbd>Esc</kbd> to return to VR.
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
