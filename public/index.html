<!-- public/index.html -->
<!-- Spiral-OS VR CLI World Builder (O-3 Pro math ready) -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- public/index.html -->
    <meta charset="UTF-8" />
    <title>Spiral-OS VR CLI World Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="aframe.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a-scene>
      <!-- Lighting -->
      <a-entity light="type: ambient; color: #BBB; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; color: #fff; intensity: 0.8" position="2 6 3"></a-entity>
      <!-- Ground -->
      <a-plane rotation="-90 0 0" width="20" height="20" color="#111a" shadow="receive: true"></a-plane>
      <!-- Camera Rig with WASD and Look controls -->
      <a-entity id="cameraRig" position="0 1.6 5">
        <a-entity camera wasd-controls look-controls></a-entity>
      </a-entity>
      <!-- VR CLI chat history blocks get injected here by app.js -->
    </a-scene>
    <!-- CLI input, fixed HTML over VR for now -->
    <form id="cli-form" autocomplete="off">
      <input id="cli-input" type="text" placeholder="Type CLI command (e.g. spawn box, help)..." autocomplete="off" />
    </form>
    <script src="app.js"></script>
  </body>
</html>
