<!-- public/index.html -->
<!-- VR-native Chat/CLI: each message is a 3D block in the scene! -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spiral-OS VR Chat CLI Scene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a-scene>
      <a-entity id="cameraRig">
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
      </a-entity>
      <!-- Message blocks will be injected here by app.js -->
    </a-scene>
    <!-- Minimal CLI input, fixed HTML for now -->
    <form id="cli-form" autocomplete="off">
      <input id="cli-input" type="text" placeholder="Type a command (e.g. spawn box)..." autofocus />
    </form>
    <script src="app.js"></script>
  </body>
</html>
